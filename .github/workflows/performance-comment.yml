name: Performance comment

# CI runs of pull requests from forks receive a read-only GITHUB_TOKEN, so they upload their
# performance and bundle size comparisons as artifacts, which this workflow posts from the base repository.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:

  performance-comment:
    name: Comment ${{ matrix.artifact }}
    if: github.event.workflow_run.event == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Each artifact is posted as its own comment, which is identified by the artifact name.
        artifact:
          - performance-comparison
          - bundle-size-comparison
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Check for a ${{ matrix.artifact }}
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -eu
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=${ARTIFACT}" \
            --jq "[ .artifacts[] | select(.name == \"${ARTIFACT}\") ] | length")
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the ${{ matrix.artifact }}
        if: steps.check.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Forks control the artifact contents, so only accept a pull request at the measured commit.
      - name: Determine the pull request to comment on
        id: pull-request
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ ! -f comparison-pull-request.txt ]; then
            echo "The artifact carries no pull request number, skipping the comment."
            exit 0
          fi
          number=$(tr -cd '0-9' < comparison-pull-request.txt)
          head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number:-0}" --jq '.head.sha' 2> /dev/null || true)
          if [ "$head" = "$HEAD_SHA" ]; then
            echo "number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "No pull request found at the measured commit ${HEAD_SHA}, skipping the comment."
          fi
      - name: Find the previous ${{ matrix.artifact }} comment
        id: previous-comment
        if: steps.pull-request.outputs.number != ''
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ steps.pull-request.outputs.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- ${{ matrix.artifact }} -->
      - name: Comment the ${{ matrix.artifact }} on the pull request
        if: steps.pull-request.outputs.number != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ steps.pull-request.outputs.number }}
          comment-id: ${{ steps.previous-comment.outputs.comment-id }}
          body-path: comparison-comment.md
          edit-mode: replace
