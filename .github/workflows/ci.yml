name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_LOWEST: 22.x
  NODE_VERSION_HIGHEST: 26.x

jobs:

  misc:
    name: Tooling checks
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VERSION_LOWEST }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_LOWEST }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build TypeScript with esModuleInterop flag
        run: yarn run build:ts --esModuleInterop true
      - name: Run linter
        run: yarn run lint
      - name: Run depcheck
        run: yarn run depcheck
      - name: Check actor READMEs
        run: yarn run readme-check
      - name: Test clean script
        run: yarn run clean

  test:
    name: Jest tests
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        node-version:
          - 22.x
          - 24.x
          - 26.x
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install dependencies and build
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn run test:ci
      - name: Submit coverage results
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          flag-name: ${{ matrix.os }}-${{ matrix.node-version }}
          parallel: true
          fail-on-error: false

  spectest:
    name: Specification tests
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        node-version:
          - 22.x
          - 24.x
          - 26.x
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install dependencies and build
        run: yarn install --frozen-lockfile --network-timeout 36000
      - name: Load RDF test suite cache
        uses: actions/cache@v6
        with:
          path: |
            .rdf-test-suite-cache
            .rdf-test-suite-ldf-cache
          key: ${{ runner.os }}-rdftestsuite-${{ secrets.CACHE_VERSION }}-${{ hashFiles('yarn.lock') }}
      - name: Run specification tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          # Retry because of https://github.com/rubensworks/rdf-test-suite.js/issues/64
          command: yarn run test:spec
      - name: Run integration tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          # Retry because of https://github.com/rubensworks/rdf-test-suite.js/issues/64
          command: yarn run test:integration

  browsertest:
    name: Browser tests
    strategy:
      fail-fast: false
      matrix:
        bundler:
          - webpack
          - vite
        include:
          - bundler: webpack
            build-script: build:browser:webpack
            bundle-path: engines/query-sparql/comunica-browser.js
          - bundler: vite
            build-script: build:browser:vite
            bundle-path: engines/query-sparql/comunica-browser-vite.js
    runs-on: ubuntu-latest
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VERSION_LOWEST }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_LOWEST }}
          cache: yarn
      - name: Install dependencies and build
        run: yarn install --frozen-lockfile
      - name: Build browser bundles
        run: yarn run ${{ matrix.build-script }}
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps
      - name: Run browser tests
        run: yarn run test:browser
        env:
          COMUNICA_BROWSER_BUNDLE: ${{ matrix.bundle-path }}

  bintest:
    name: Binary tests
    runs-on: ubuntu-latest
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VERSION_LOWEST }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_LOWEST }}
          cache: yarn
      - name: Install dependencies and build monorepo
        run: yarn install --frozen-lockfile
      - name: Test binaries
        run: yarn run test:bins

  configtest:
    name: Config backwards-compat tests
    runs-on: ubuntu-latest
    if: '!startsWith(github.event.head_commit.message, ''Bump to release version'')'
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VERSION_LOWEST }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_LOWEST }}
          cache: yarn
      - name: Install dependencies and build monorepo
        run: yarn install --frozen-lockfile
      - name: Test current configs in previous versions of Comunica from npm
        run: yarn run test:config-compat

  coveralls:
    name: Coverage check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Consolidate test coverage from different jobs
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
          fail-on-error: false

  browserbuilds:
    name: Browser builds
    needs:
      - misc
      - test
      - spectest
      - browsertest
      - bintest
      - configtest
    strategy:
      fail-fast: false
      matrix:
        bundler:
          - webpack
          - vite
        include:
          - bundler: webpack
            build-script: build:browser:webpack
          - bundler: vite
            build-script: build:browser:vite
    runs-on: ubuntu-latest
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VERSION_LOWEST }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_LOWEST }}
          cache: yarn
      - name: Install dependencies and build
        run: yarn install --frozen-lockfile
      - name: Build browser bundles
        run: yarn run ${{ matrix.build-script }}
      - name: Deploy browser builds
        # Only the webpack bundles are deployed; the vite build is currently CI-only.
        if: matrix.bundler == 'webpack' && (startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/'))
        run: ./.github/deploy_browser.sh
        env:
          GH_TOKEN: ${{ secrets.PAT }}

  dockerimages:
    name: Docker images
    needs:
      - misc
      - test
      - spectest
      - browsertest
      - bintest
      - configtest
    runs-on: ubuntu-latest
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VERSION_LOWEST }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_LOWEST }}
          cache: yarn
      - name: Install dependencies and build monorepo
        run: yarn install --frozen-lockfile
      - name: Install Lerna Docker
        run: sh -c "`curl -fsSl https://raw.githubusercontent.com/rubensworks/lerna-docker/master/install.sh`"
      - name: Build Docker images
        run: ~/.lerna-docker/bin/lerna-docker comunica build
      - name: Test Docker images
        run: yarn run test:docker
      - name: Deploy Docker images
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/')
        run: ~/.lerna-docker/bin/lerna-docker comunica push
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      - name: Deploy Docker images (next/major)
        if: startsWith(github.ref, 'refs/heads/next')
        run: ~/.lerna-docker/bin/lerna-docker comunica push next
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  performance:
    name: Performance benchmarks
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/feature') || startsWith(github.ref, 'refs/heads/next')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The web benchmark is omitted on pull requests, as its query set varies across runs,
        # which makes its totals incomparable between two runs.
        benchmark: ${{ github.event_name == 'pull_request' && fromJSON('["watdiv-file", "watdiv-tpf", "bsbm-file", "bsbm-file-10k", "bsbm-tpf", "ldbc-snb-file"]') || fromJSON('["watdiv-file", "watdiv-tpf", "bsbm-file", "bsbm-file-10k", "bsbm-tpf", "ldbc-snb-file", "web"]') }}
    env:
      BENCHMARK_BASE: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: head
      - name: Check out the base commit of the pull request
        if: env.BENCHMARK_BASE == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Use Node.js ${{ env.NODE_VERSION_HIGHEST }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_HIGHEST }}
          cache: yarn
          cache-dependency-path: head/yarn.lock
      - name: Install dependencies and build monorepo
        run: yarn install --frozen-lockfile
        working-directory: head
      - name: Install dependencies and build monorepo of the base commit
        if: env.BENCHMARK_BASE == 'true'
        run: yarn install --frozen-lockfile
        working-directory: base
      - name: Run benchmarks of the base commit
        # A benchmark that is new in the pull request has no base results.
        if: env.BENCHMARK_BASE == 'true' && hashFiles(format('base/performance/benchmark-{0}/package.json', matrix.benchmark)) != ''
        run: cd base/performance/benchmark-${{ matrix.benchmark }}/ && yarn run performance:ci
      - name: Remove containers left behind by the base commit benchmarks
        # The TPF benchmarks run their LDF server in Docker on fixed ports,
        # so the benchmarks below must start from the same clean state as the base ones did.
        if: env.BENCHMARK_BASE == 'true'
        run: docker ps -aq | xargs -r docker rm -f
      - name: Run benchmarks
        run: cd head/performance/benchmark-${{ matrix.benchmark }}/ && yarn run performance:ci
      - uses: actions/upload-artifact@v7
        with:
          name: performance-benchmark-${{ matrix.benchmark }}
          path: head/performance/benchmark-${{ matrix.benchmark }}/combinations/combination_0/output/
      - uses: actions/upload-artifact@v7
        if: env.BENCHMARK_BASE == 'true' && hashFiles(format('base/performance/benchmark-{0}/package.json', matrix.benchmark)) != ''
        with:
          name: performance-benchmark-base-${{ matrix.benchmark }}
          path: base/performance/benchmark-${{ matrix.benchmark }}/combinations/combination_0/output/
      - name: Print raw output
        run: cat head/performance/benchmark-${{ matrix.benchmark }}/combinations/combination_0/output/query-times.csv
      - name: Print raw output of the base commit
        if: env.BENCHMARK_BASE == 'true' && hashFiles(format('base/performance/benchmark-{0}/package.json', matrix.benchmark)) != ''
        run: cat base/performance/benchmark-${{ matrix.benchmark }}/combinations/combination_0/output/query-times.csv

  performance-consolidate:
    name: Performance analysis
    # Pull request results are compared in performance-compare instead, and are never stored.
    if: github.event_name != 'pull_request'
    needs:
      - misc
      - test
      - spectest
      - browsertest
      - bintest
      - configtest
      - performance
    runs-on: ubuntu-latest
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VERSION_HIGHEST }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_HIGHEST }}
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-watdiv-file
          path: performance/benchmark-watdiv-file/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-watdiv-tpf
          path: performance/benchmark-watdiv-tpf/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-bsbm-file
          path: performance/benchmark-bsbm-file/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-bsbm-file-10k
          path: performance/benchmark-bsbm-file-10k/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-bsbm-tpf
          path: performance/benchmark-bsbm-tpf/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-ldbc-snb-file
          path: performance/benchmark-ldbc-snb-file/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-web
          path: performance/benchmark-web/combinations/combination_0/output/
      - name: Process benchmark detailed results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench performance/benchmark-watdiv-file/combinations/combination_0/output/ performance/benchmark-watdiv-tpf/combinations/combination_0/output/ performance/benchmark-bsbm-file/combinations/combination_0/output/ performance/benchmark-bsbm-file-10k/combinations/combination_0/output/ performance/benchmark-bsbm-tpf/combinations/combination_0/output/ performance/benchmark-ldbc-snb-file/combinations/combination_0/output/ performance/benchmark-web/combinations/combination_0/output/ --overrideCombinationLabels WatDiv-File,WatDiv-TPF,BSBM-File,BSBM-File-10k,BSBM-TPF,LDBC-SNB-File,Web --total false --detailed true --failures --name ghbench-detail.json
      - name: Process benchmark total results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench performance/benchmark-watdiv-file/combinations/combination_0/output/ performance/benchmark-watdiv-tpf/combinations/combination_0/output/ performance/benchmark-bsbm-file/combinations/combination_0/output/ performance/benchmark-bsbm-file-10k/combinations/combination_0/output/ performance/benchmark-bsbm-tpf/combinations/combination_0/output/ performance/benchmark-ldbc-snb-file/combinations/combination_0/output/ performance/benchmark-web/combinations/combination_0/output/ --overrideCombinationLabels WatDiv-File,WatDiv-TPF,BSBM-File,BSBM-File-10k,BSBM-TPF,LDBC-SNB-File,Web --total true --detailed false --name ghbench-total.json
      - name: Determine benchmark detailed results target directory name
        run: echo "BENCHMARK_DATA_DIR_PATH_DETAIL=comunica/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}/benchmarks-detail" >> $GITHUB_ENV
      - name: Determine benchmarks total results target directory name
        run: echo "BENCHMARK_DATA_DIR_PATH_TOTAL=comunica/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}/benchmarks-total" >> $GITHUB_ENV
      - name: Finalize benchmarks detailed results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmarks detailed results
          tool: customSmallerIsBetter
          output-file-path: ghbench-detail.json
          github-token: ${{ secrets.PAT }}
          auto-push: true
          alert-comment-cc-users: '@rubensworks'
          gh-repository: github.com/comunica/comunica-performance-results
          gh-pages-branch: master
          benchmark-data-dir-path: ${{ env.BENCHMARK_DATA_DIR_PATH_DETAIL }}
      - name: Cleanup benchmark-action data
        run: rm -rf ./benchmark-data-repository
      - name: Finalize benchmarks total results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmarks total results
          tool: customSmallerIsBetter
          output-file-path: ghbench-total.json
          github-token: ${{ secrets.PAT }}
          auto-push: true
          alert-threshold: '150%'
          comment-always: true
          comment-on-alert: true
          alert-comment-cc-users: '@rubensworks'
          summary-always: true
          gh-repository: github.com/comunica/comunica-performance-results
          gh-pages-branch: master
          benchmark-data-dir-path: ${{ env.BENCHMARK_DATA_DIR_PATH_TOTAL }}
      - name: Prepare comment on commit with link to performance results
        run: echo -e "Performance benchmarks succeeded! 🚀\n\n\[[Summarized results](https://comunica.github.io/comunica-performance-results/comunica/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}/benchmarks-total/)\] \[[Detailed results](https://comunica.github.io/comunica-performance-results/comunica/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}/benchmarks-detail/)\]" > ./commit-comment-body.txt
      - name: Comment on commit with link to performance results
        uses: peter-evans/commit-comment@v4
        with:
          body-path: ./commit-comment-body.txt

  performance-compare:
    name: Performance comparison
    if: github.event_name == 'pull_request'
    needs:
      - performance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VERSION_HIGHEST }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_HIGHEST }}
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-watdiv-file
          path: performance/benchmark-watdiv-file/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-watdiv-tpf
          path: performance/benchmark-watdiv-tpf/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-bsbm-file
          path: performance/benchmark-bsbm-file/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-bsbm-file-10k
          path: performance/benchmark-bsbm-file-10k/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-bsbm-tpf
          path: performance/benchmark-bsbm-tpf/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-ldbc-snb-file
          path: performance/benchmark-ldbc-snb-file/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-base-watdiv-file
          path: base/performance/benchmark-watdiv-file/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-base-watdiv-tpf
          path: base/performance/benchmark-watdiv-tpf/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-base-bsbm-file
          path: base/performance/benchmark-bsbm-file/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-base-bsbm-file-10k
          path: base/performance/benchmark-bsbm-file-10k/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        with:
          name: performance-benchmark-base-bsbm-tpf
          path: base/performance/benchmark-bsbm-tpf/combinations/combination_0/output/
      - uses: actions/download-artifact@v8
        # Missing when the benchmark is new in the pull request
        continue-on-error: true
        with:
          name: performance-benchmark-base-ldbc-snb-file
          path: base/performance/benchmark-ldbc-snb-file/combinations/combination_0/output/
      - name: Process benchmark detailed results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench performance/benchmark-watdiv-file/combinations/combination_0/output/ performance/benchmark-watdiv-tpf/combinations/combination_0/output/ performance/benchmark-bsbm-file/combinations/combination_0/output/ performance/benchmark-bsbm-file-10k/combinations/combination_0/output/ performance/benchmark-bsbm-tpf/combinations/combination_0/output/ performance/benchmark-ldbc-snb-file/combinations/combination_0/output/ --overrideCombinationLabels WatDiv-File,WatDiv-TPF,BSBM-File,BSBM-File-10k,BSBM-TPF,LDBC-SNB-File --total false --detailed true --name ghbench-detail.json
      - name: Process benchmark total results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench performance/benchmark-watdiv-file/combinations/combination_0/output/ performance/benchmark-watdiv-tpf/combinations/combination_0/output/ performance/benchmark-bsbm-file/combinations/combination_0/output/ performance/benchmark-bsbm-file-10k/combinations/combination_0/output/ performance/benchmark-bsbm-tpf/combinations/combination_0/output/ performance/benchmark-ldbc-snb-file/combinations/combination_0/output/ --overrideCombinationLabels WatDiv-File,WatDiv-TPF,BSBM-File,BSBM-File-10k,BSBM-TPF,LDBC-SNB-File --total true --detailed false --name ghbench-total.json
      - name: Determine base commit benchmark results
        # Benchmarks that are new in the pull request have no base results
        run: |
          dirs="base/performance/benchmark-watdiv-file/combinations/combination_0/output/ base/performance/benchmark-watdiv-tpf/combinations/combination_0/output/ base/performance/benchmark-bsbm-file/combinations/combination_0/output/ base/performance/benchmark-bsbm-file-10k/combinations/combination_0/output/ base/performance/benchmark-bsbm-tpf/combinations/combination_0/output/"
          labels="WatDiv-File,WatDiv-TPF,BSBM-File,BSBM-File-10k,BSBM-TPF"
          if [ -f base/performance/benchmark-ldbc-snb-file/combinations/combination_0/output/query-times.csv ]; then
            dirs="$dirs base/performance/benchmark-ldbc-snb-file/combinations/combination_0/output/"
            labels="$labels,LDBC-SNB-File"
          fi
          echo "BASE_BENCHMARK_DIRS=$dirs" >> $GITHUB_ENV
          echo "BASE_BENCHMARK_LABELS=$labels" >> $GITHUB_ENV
      - name: Process base commit benchmark detailed results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench $BASE_BENCHMARK_DIRS --overrideCombinationLabels $BASE_BENCHMARK_LABELS --total false --detailed true --name ghbench-base-detail.json
      - name: Process base commit benchmark total results
        run: npx -p @rubensworks/process-sparql-benchmark-results psbr csv ghbench $BASE_BENCHMARK_DIRS --overrideCombinationLabels $BASE_BENCHMARK_LABELS --total true --detailed false --name ghbench-base-total.json
      - name: Assemble the comparison comment
        # Posted by the performance-comment workflow, as this job
        # receives a read-only GITHUB_TOKEN on pull requests from forks.
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          table () {
            jq -rn \
              --slurpfile headResults "ghbench-$1.json" \
              --slurpfile baseResults "ghbench-base-$1.json" \
              --arg headSha "$HEAD_SHA" \
              --arg baseSha "$BASE_SHA" \
              '
                def row: "| " + join(" | ") + " |";
                # Ratios are rounded to two decimals, and are below 1 when the pull request is faster
                def ratio($current; $previous):
                  if $previous == 0
                  then (if $current == 0 then "1.00" else "\u221e" end)
                  else ($current * 100 / $previous | round)
                    | "\(. / 100 | floor).\(. % 100 | tostring | if length == 1 then "0\(.)" else . end)"
                  end;
                ($baseResults[0] | INDEX(.name)) as $base
                | [ ([ "Benchmark suite", "Current: \($headSha)", "Base: \($baseSha)", "Ratio" ] | row), "|-|-|-|-|" ]
                  + ($headResults[0] | map(
                      $base[.name] as $baseEntry
                      | [ "`\(.name)`", "`\(.value)` \(.unit)" ] + (
                          if $baseEntry == null
                          then [ "", "" ]
                          else [ "`\($baseEntry.value)` \($baseEntry.unit)", "`\(ratio(.value; $baseEntry.value))`" ]
                          end)
                      | row))
                | join("\n")
              '
          }
          {
            printf '<!-- performance-comparison -->\n\n# Benchmarks total results\n\n'
            table total
            printf '\n\n<details>\n<summary>Show detailed results</summary>\n\n'
            table detail
            printf '\n\n</details>\n\nMeasured by [this CI run](%s/%s/actions/runs/%s).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > comparison-comment.md
          echo "$PULL_REQUEST_NUMBER" > comparison-pull-request.txt
          cat comparison-comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: performance-comparison
          path: |
            comparison-comment.md
            comparison-pull-request.txt

  documentation:
    name: Prepare documentation
    runs-on: ubuntu-latest
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ env.NODE_VERSION_LOWEST }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION_LOWEST }}
          cache: yarn
      - name: Install dependencies
        run: yarn install --ignore-scripts --frozen-lockfile
      - name: Build documentation
        run: yarn run doc
      - name: Prepare artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: documentation
          name: documentation

  documentation-publish:
    name: Publish documentation
    needs:
      - misc
      - test
      - spectest
      - browsertest
      - bintest
      - configtest
      - documentation
    runs-on: ubuntu-latest
    # The documentation is only published for master branch
    if: startsWith(github.ref, 'refs/heads/master')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: documentation
