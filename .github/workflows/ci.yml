# Temporary debug workflow on a throwaway branch, do not merge.
name: Debug web benchmark
on: [push]

jobs:
  performance-web-debug:
    name: Debug harvard-san-francisco-limit-service
    runs-on: ubuntu-latest
    steps:
      - name: Ensure line endings are consistent
        run: git config --global core.autocrlf input
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: yarn
      - name: Install dependencies and build monorepo
        run: yarn install --frozen-lockfile
      - name: Run the benchmark for a single query
        working-directory: performance/benchmark-web
        run: yarn run jbr prepare -c 0 && yarn run jbr run -c 0 --filter harvard-san-francisco-limit-service
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-benchmark-web-debug
          path: performance/benchmark-web/combinations/combination_0/output/
      - name: Print raw output
        if: always()
        run: cat performance/benchmark-web/combinations/combination_0/output/query-times.csv
      - name: Print endpoint logs
        if: always()
        run: cat performance/benchmark-web/combinations/combination_0/output/logs/cli-stderr.txt
